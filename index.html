/* swipe om een kaartje weg te leggen */
let sw = null;
document.addEventListener('pointerdown', e=>{
  const c = e.target.closest('.card'); if(!c || e.target.closest('.x')) return;
  sw = {el:c, x:e.clientX, y:e.clientY, dx:0, active:false};
});
document.addEventListener('pointermove', e=>{
  if(!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if(!sw.active){ if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){ sw.active = true; sw.el.style.transition='none'; } else if(Math.abs(dy) > 10){ sw = null; return; } }
  if(sw.active){ sw.dx = dx; sw.el.style.transform = `translateX(${dx}px)`; sw.el.style.opacity = String(Math.max(.2, 1 - Math.abs(dx)/260)); }
});
function endSwipe(){
  if(!sw) return; const {el, dx, active} = sw; sw = null; if(!active) return;
  el.style.transition = '';
  if(Math.abs(dx) > 90){ el.style.transform = `translateX(${dx>0?'110%':'-110%'})`; el.style.opacity='0'; el.classList.add('gone'); setTimeout(()=>dismissCard(el.dataset.card), 200); }
  else { el.style.transform=''; el.style.opacity=''; }
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);

function planChanged(rerenderForm){
  rebuildToday(); save(); renderHeader(); renderScene();
  if(rerenderForm){ const y = window.scrollY; renderMain(); window.scrollTo({top:y}); }
  toast(t('saved'));
}
let noteTimer = null;
document.addEventListener('input', e=>{
  const n = e.target.closest('[data-note]');
  if(n){ const x = findTask(n.dataset.note); if(x){ x.note = n.value; delete S.dismissed[dismissKey(today().date,x)]; clearTimeout(noteTimer); noteTimer = setTimeout(()=>{ save(); renderScene(); }, 400); } return; }
  const f = e.target.dataset.f; if(!f || S.role!=='owner') return;
  const P = S.plan, later = fn => { clearTimeout(noteTimer); noteTimer = setTimeout(fn, 400); };
  if(f==='pet.name'){ P.pets.find(p=>p.id===e.target.closest('[data-pet]').dataset.pet).name = e.target.value; later(()=>planChanged(false)); }
  if(f==='notes'){ P.notes = e.target.value; later(save); }
  if(f && f.startsWith('oi.')){ P.owner_info = P.owner_info||{}; P.owner_info[f.slice(3)] = e.target.value; later(save); }
  if(f==='vet.name'){ P.vet.name = e.target.value; later(save); }
  if(f==='vet.phone'){ P.vet.phone = e.target.value; later(save); }
  if(f==='med.text' || f==='custom.text'){
    const el = e.target.closest(f==='med.text'?'[data-med]':'[data-custom]');
    const list = f==='med.text' ? P.meds : P.custom; list.find(x=>x.id===(el.dataset.med||el.dataset.custom)).text = e.target.value; later(()=>planChanged(false));
  }
});
document.addEventListener('focusout', e=>{ if(e.target.matches('[data-note]')){ const x = findTask(e.target.dataset.note); if(x){ x.note = e.target.value; save(); } } });
document.addEventListener('change', e=>{
  const f = e.target.dataset.f; if(!f || S.role!=='owner') return;
  const P = S.plan, val = e.target.value, byId = (list, attr) => list.find(x=>x.id===e.target.closest('['+attr+']').getAttribute(attr));
  if(f==='feed.time') byId(P.feedings,'data-feed').time = val;
  else if(f==='feed.portion') byId(P.feedings,'data-feed').portions[e.target.dataset.pet] = val;
  else if(f==='walk.time') byId(P.walks,'data-walk').time = val;
  else if(f==='walk.duration') byId(P.walks,'data-walk').duration = Number(val);
  else if(f==='chore.on') P.chores[e.target.dataset.k].on = e.target.checked;
  else if(f==='chore.time') P.chores[e.target.dataset.k].time = val;
  else if(f==='chore.time_off') P.chores.lamp.time_off = val;
  else if(f==='chore.weekday') P.chores.kliko.weekday = Number(val);
  else if(f==='med.time') byId(P.meds,'data-med').time = val;
  else if(f==='med.pet') byId(P.meds,'data-med').pet_id = val;
  else if(f==='oi.hood'){ P.owner_info = P.owner_info||{}; P.owner_info.hood = val; save(); renderMain(); return; }
  else if(f==='custom.time') byId(P.custom,'data-custom').time = val;
  else if(f.startsWith('bk.')){
    const fo = bkForm();
    if(f==='bk.date') fo.date = val; else if(f==='bk.date2') fo.date2 = val;
    else if(f==='bk.start') fo.start = val; else if(f==='bk.end') fo.end = val;
    else { const r = fo.rows[Number(e.target.closest('[data-row]').dataset.row)];
      if(f==='bk.rdate') r.date = val; else if(f==='bk.rstart') r.start = val; else r.end = val; }
    save(); return;
  }
  else return;
  planChanged(false);
});

/* ---------------- export (Odoo-vormig) ---------------- */
function exportJSON(){
  const P = S.plan, f2 = m => Math.round(m/60*100)/100;
  const out = {
    _info:'Huisdierenoppas Curaçao export — veldnamen volgen docs/DATAMODEL.md',
    'hoc.pet': P.pets.map(p=>({x_id:p.id, name:p.name, species:p.species, coat_color:p.coat, pattern:p.pattern, ears:p.ears||false})),
    'hoc.care.plan': [{x_id:'plan_1', notes:P.notes, vet_name:P.vet.name, vet_phone:P.vet.phone}],
    'hoc.care.plan.feeding': P.feedings.flatMap(f=>Object.entries(f.portions).filter(([,c])=>c!=='none').map(([pid,c])=>({plan_id:'plan_1', moment_id:f.id, time:f2(toMin(f.time)), pet_id:pid, portion:c}))),
    'hoc.care.plan.walk': P.walks.map(w=>({x_id:w.id, plan_id:'plan_1', time:f2(toMin(w.time)), duration:w.duration, pet_ids:w.dog_ids})),
    'hoc.care.plan.chore': Object.entries(P.chores).filter(([,c])=>c.on).map(([k,c])=>({plan_id:'plan_1', code:k, time:f2(toMin(c.time)), time_off:c.time_off?f2(toMin(c.time_off)):false, weekday:c.weekday??false}))
      .concat(P.meds.map(m=>({plan_id:'plan_1', code:'medication', time:f2(toMin(m.time)), pet_id:m.pet_id, description:m.text})))
      .concat(P.custom.map(c=>({plan_id:'plan_1', code:'custom', time:f2(toMin(c.time)), description:c.text}))),
    'hoc.care.task': Object.values(S.days).flatMap(d=>d.tasks.map(x=>({x_id:d.date+'/'+x.id, date:d.date, kind:x.kind, name:taskTitle(x),
      time_start:f2(x.time_start), time_end:x.time_end!=null?f2(x.time_end):false, pet_ids:x.pet_ids, state:x.state,
      outcome:x.outcome||false, note:x.note||false, note_read:!!S.dismissed[d.date+'/'+x.id], done_at:x.done_at||false, later_at:x.later_at||false}))),
  };
  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'huisdierenoppas-export-'+dateKey(new Date())+'.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ---------------- boot ---------------- */
S = load() || seed();
if(!isActive()) S.tab = 'booking';
save(); render();
setInterval(yumTick, 5000);
let lastKey = dateKey(nowDate());
setInterval(()=>{
  const k = dateKey(nowDate());
  if(k!==lastKey){ lastKey=k; openTask=null; render(); return; }
  renderHeader(); renderScene();
  if(S.tab==='today' && !document.activeElement.matches('textarea') && !sw) renderMain();
}, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) render(); });
</script>

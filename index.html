<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huisdierenoppas Curaçao</title>
<meta name="description" content="Dagelijkse zorgtaken voor huisdieren, afvinken door de oppas, live te volgen door de eigenaar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Oppas Curaçao">
<meta name="theme-color" content="#F8F6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1E27" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232C9CC6'/%3E%3Cellipse cx='32' cy='46' rx='26' ry='9' fill='%23EEDFBF'/%3E%3Cpath d='M22 44 Q20 30 26 20' stroke='%239A7048' stroke-width='3' fill='none'/%3E%3Cpath d='M26 20 Q14 14 8 20 Q16 16 26 22Z M26 20 Q38 12 46 18 Q36 16 26 22Z' fill='%232F9E6E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light dark;
  --bg:#F8F6F1; --surface:#FFFFFF; --surface-2:#F2EFE8;
  --ink:#16323D; --ink-2:#51666E; --ink-3:#8A999E;
  --line:#E6E1D7;
  --accent:#1490B4; --accent-ink:#FFFFFF; --accent-soft:#DDF0F6;
  --ok:#14A37B; --ok-soft:#DBF3EA;
  --note:#F0902F; --note-soft:#FDEBD9;
  --late:#F05B4C; --late-soft:#FDE2DE;
  --idle:#C9C3B6;
  --sky-1:#A9DFF0; --sky-2:#E6F6F8; --sun:#F8D27A; --sun-glow:#FCEFCB;
  --sea-1:#4FBCD6; --sea-2:#2596BE; --sea-3:#1A7AA6; --lagoon:#8FE0E6; --foam:#F2FBFC;
  --sand:#EEDFBF; --sand-2:#E2CDA2; --sand-3:#F6ECD6;
  --palm:#2BAE78; --palm-2:#1C8A5C; --trunk:#9A7048; --cactus:#4CA06A; --cactus-2:#357A50;
  --bowl:#2C9CC6; --bowl-rim:#5DB8DA; --kibble:#8A5A2B; --leaf:#5DAA4E;
  --shadow:0 1px 2px rgba(22,50,61,.05), 0 8px 24px -16px rgba(22,50,61,.25);
  --font:"Figtree","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1E27; --surface:#10272F; --surface-2:#153039;
    --ink:#E7F0F1; --ink-2:#A3B7BC; --ink-3:#6E868C;
    --line:#1E3A44;
    --accent:#5CC0E4; --accent-ink:#06202B; --accent-soft:#143A48;
    --ok:#3FD4A2; --ok-soft:#0F3C2F; --note:#F9AE5C; --note-soft:#3C2A16; --late:#FF8878; --late-soft:#40201C; --idle:#4A5F66;
    --sky-1:#173F55; --sky-2:#10303F; --sun:#F2DDA0; --sun-glow:#2C4B5C;
    --sea-1:#1C6A84; --sea-2:#145770; --sea-3:#0E4258; --lagoon:#2A8594; --foam:#5FA3B4;
    --sand:#8C7A55; --sand-2:#6E5E40; --sand-3:#9A8862;
    --palm:#2F7A52; --palm-2:#1E5539; --trunk:#6E5236; --cactus:#3F7550; --cactus-2:#2F5A3D;
    --bowl:#3AA2C7; --bowl-rim:#6FC2DE;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1E27; --surface:#10272F; --surface-2:#153039;
  --ink:#E7F0F1; --ink-2:#A3B7BC; --ink-3:#6E868C;
  --line:#1E3A44;
  --accent:#5CC0E4; --accent-ink:#06202B; --accent-soft:#143A48;
  --ok:#3FD4A2; --ok-soft:#0F3C2F; --note:#F9AE5C; --note-soft:#3C2A16; --late:#FF8878; --late-soft:#40201C; --idle:#4A5F66;
  --sky-1:#173F55; --sky-2:#10303F; --sun:#F2DDA0; --sun-glow:#2C4B5C;
  --sea-1:#1C6A84; --sea-2:#145770; --sea-3:#0E4258; --lagoon:#2A8594; --foam:#5FA3B4;
  --sand:#8C7A55; --sand-2:#6E5E40; --sand-3:#9A8862;
  --palm:#2F7A52; --palm-2:#1E5539; --trunk:#6E5236; --cactus:#3F7550; --cactus-2:#2F5A3D;
  --bowl:#3AA2C7; --bowl-rim:#6FC2DE;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.shell{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

.top{position:absolute;top:0;left:0;right:0;z-index:5;background:transparent;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 10px;color:#16323D;transition:color .6s;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.top h1 span{display:block;font-size:12.5px;font-weight:500;opacity:.7;letter-spacing:0}
.top.light{color:#F4F1EA}
.rolebtn{border:0;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;color:#16323D;white-space:nowrap}
.top.light .rolebtn{background:rgba(255,255,255,.16);color:#F4F1EA}

.scene{position:relative;overflow:hidden;background:var(--sand)}
.scene svg{display:block;width:100%;height:auto;touch-action:manipulation}
.prog{position:absolute;left:18px;right:18px;bottom:6px;height:4px;border-radius:9px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .5s ease}

main{flex:1;padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 92px);display:flex;flex-direction:column;gap:22px}
.sec>h2{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between}
.sec>h2 span{font-weight:600;letter-spacing:0;text-transform:none}
.sub{margin:0;font-size:14px;color:var(--ink-2)}
.muted{color:var(--ink-3)}

.status{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
.st{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:13px 16px}
.st+.st{border-top:1px solid var(--line)}
.st .d{width:12px;height:12px;border-radius:50%;background:var(--idle)}
.st.ok .d{background:var(--ok)} .st.note .d{background:var(--note)} .st.late .d{background:var(--late)}
.st b{font-weight:600;font-size:15px}
.st small{display:block;font-size:13px;color:var(--ink-3);line-height:1.35}
.st.late small{color:var(--late)} .st.note small{color:var(--note)}
.st em{font-style:normal;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.cards{display:flex;flex-direction:column;gap:10px}
.card{position:relative;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 44px 14px 14px;
  display:grid;grid-template-columns:40px 1fr;gap:12px;touch-action:pan-y;transition:transform .25s ease,opacity .25s ease;user-select:none;-webkit-user-select:none}
.card.gone{transform:translateX(110%)!important;opacity:0}
.card .av{width:40px;height:40px;border-radius:50%;background:var(--surface-2);overflow:hidden}
.card .av svg{width:100%;height:100%;display:block}
.card .meta{font-size:12.5px;color:var(--ink-3);font-weight:500}
.card .meta b{color:var(--ink-2);font-weight:600}
.card p{margin:3px 0 0;font-size:15px;line-height:1.45}
.card.empty-card{align-items:center}
.card.empty-card p{margin:0;font-size:15px}
button.card{width:100%;text-align:left;border:0;cursor:pointer;align-items:start;font:inherit;color:inherit;grid-template-columns:40px 1fr auto;padding-right:14px}
button.card .pill{align-self:center}
.msg.note{border-left:3px solid var(--note)}
.msg.sys{background:var(--late-soft);border-radius:14px}
.msg.sys p{color:var(--late)}
.msg i{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--note);margin-bottom:2px}
.card .x{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--ink-3);font-size:20px;line-height:1;cursor:pointer}
.hint{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:8px}
.empty{padding:16px;text-align:center;color:var(--ink-3);font-size:14px;background:var(--surface);border-radius:18px}

.list{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.task+.task{border-top:1px solid var(--line)}
.task-row{display:grid;grid-template-columns:1fr 50px;align-items:center}
.rowmain{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:13px 4px 13px 16px;cursor:pointer}
.checkbtn{background:none;border:0;padding:13px 16px 13px 0;cursor:pointer;display:grid;place-items:center}
.task.off{opacity:.42}
.task.off .checkbtn{pointer-events:none}
.offlbl{font-size:12px;color:var(--ink-3);font-style:italic}
.tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;color:var(--ink-2)}
.tt b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.tt span{display:block;font-size:13px;color:var(--ink-3);line-height:1.35}
.task.now .tm{color:var(--accent)}
.task.now .tt b:after{content:attr(data-now);margin-left:8px;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:99px;vertical-align:2px}
.task.late .tm{color:var(--late)}
.task.done .tt b{color:var(--ink-3)}
.tt .out{color:var(--ok);font-style:normal} .tt .out.warn{color:var(--note)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.task.done .check{background:var(--ok);border-color:var(--ok)} .task.done.warn .check{background:var(--note);border-color:var(--note)}
.task.done .check svg{opacity:1}
.task-x{padding:0 16px 16px 80px;display:flex;flex-direction:column;gap:10px}
.opts.mini{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.opts.mini .opt{padding:8px 6px;font-size:13px;border-radius:10px}
/* chat */
.chat{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.msgs{display:flex;flex-direction:column;gap:8px;padding:14px 14px 10px;max-height:260px;overflow-y:auto}
.msg{max-width:82%;align-self:flex-start;background:var(--surface-2);border-radius:14px 14px 14px 4px;padding:8px 11px}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-radius:14px 14px 4px 14px}
.msg p{margin:0;font-size:14.5px;line-height:1.4}
.msg time{display:block;font-size:11px;color:var(--ink-3);margin-top:3px}
.chatin{display:grid;grid-template-columns:1fr 40px;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.chatin input{border-radius:99px}
.send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.send svg{width:18px;height:18px;fill:currentColor}
/* boeking */
.bcard{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.bcard.sitter{padding:12px 14px;gap:8px}
.bcard.tap{cursor:pointer;text-align:left;border:0;font:inherit;color:inherit;width:100%;display:flex;flex-direction:column;gap:4px}
.bcard.picked{box-shadow:var(--shadow), inset 0 0 0 2px var(--accent)}
.sitterhead{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:none;border:0;padding:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.sitterhead .ava{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:17px}
.sitterhead b{display:block;font-size:15.5px}
.sitterhead .sub{font-size:12.5px}
.rate{text-align:right}.rate .st{display:block;color:var(--note);letter-spacing:1px;font-size:13px}
.pill.warn{background:var(--late-soft);color:var(--late)}
.bcard h3{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.note{background:var(--note-soft);color:var(--note)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:14px}
.kv b{font-weight:600;color:var(--ink-2)}
.daylist{display:flex;flex-direction:column;gap:6px}
.dayrow{display:grid;grid-template-columns:1fr 150px auto;gap:8px;align-items:center;font-size:14px}
.brow{display:flex;gap:8px;flex-wrap:wrap}
.choice{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;justify-self:center}
.choice b{display:block;font-size:15.5px}.choice span{display:block;font-size:13px;color:var(--ink-3)}
.scene.inactive{filter:saturate(.3) contrast(.95)}
.scene .veilmsg{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 56px);font-size:12.5px;font-weight:600;color:var(--ink-2);background:color-mix(in srgb,var(--surface) 92%,transparent);padding:6px 12px;border-radius:99px;white-space:nowrap;box-shadow:var(--shadow)}
.tabs button{position:relative}
.tabs .dot{position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--late)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.25;text-align:center}
.opt small{display:block;font-weight:500;color:var(--ink-3);font-size:12px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt.sel.warn{border-color:var(--note);background:var(--note-soft);color:var(--note)}
.opt.full{grid-column:1/-1}
textarea,input[type=text],input[type=tel],input[type=time],select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 11px;font-size:15px;outline:none}
textarea{resize:vertical;min-height:60px}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
.lnk{background:none;border:0;padding:2px 0;color:var(--ink-3);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13.5px}
.btn.danger{color:var(--late)}
details.all>summary{cursor:pointer;list-style:none;font-size:14px;font-weight:600;color:var(--accent);padding:4px 0}
details.all>summary::-webkit-details-marker{display:none}
.lrow{display:grid;grid-template-columns:12px 48px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.lrow .d{width:9px;height:9px;border-radius:50%;background:var(--idle)}
.lrow .d.ok{background:var(--ok)}.lrow .d.note{background:var(--note)}.lrow .d.late{background:var(--late)}
.lrow .muted{font-size:13px}

.panel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:16px;font-weight:700}
.lbl{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 0 -4px}
.petcard{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pethead{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center}
.petprev{width:72px;height:54px;background:var(--sky-2);border-radius:12px;overflow:hidden}
.petprev svg{width:100%;height:100%;display:block}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.sel{outline:2.5px solid var(--accent);outline-offset:2px}
.line2{display:grid;grid-template-columns:124px 1fr auto;gap:8px;align-items:center}
.xbtn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-3);font-size:18px;line-height:1}
.portion{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;font-size:14.5px}
.toggle{display:grid;grid-template-columns:auto 1fr 124px;gap:10px;align-items:center;font-size:14.5px}
.toggle input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.ro-note{font-size:13px;background:var(--note-soft);color:var(--note);padding:9px 12px;border-radius:12px;font-weight:600}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:14px}
fieldset[disabled]{opacity:.7}

.day{background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.day>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;justify-content:space-between;gap:10px}
.day>summary::-webkit-details-marker{display:none}
.day>summary b{font-weight:600}
.day .inner{padding:0 16px 10px}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tabs .inner{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:560px}
.tabs button{border:0;background:transparent;padding:6px 2px 4px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"] svg{stroke:var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);
  padding:9px 15px;border-radius:99px;font-size:13px;font-weight:600;z-index:50;transition:all .25s ease;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- scene & pets ---------- */
.moon,.stars{opacity:0;transition:opacity .6s}
.night .moon,.night .stars{opacity:1}
.night .skyday,.night .sunb{opacity:0}
.skyday,.sunb{transition:opacity .6s}
.veil{opacity:0;pointer-events:none;transition:opacity .6s}
.night .veil{opacity:.3}
.wave{animation:wave 7s ease-in-out infinite alternate}
.wave.w2{animation-duration:9s;animation-delay:-3s}
@keyframes wave{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.palmtop{transform-origin:62px 92px;animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
.lights circle{animation:twinkle 1.6s ease-in-out infinite alternate}
.lights circle:nth-child(3n){animation-delay:-.5s}.lights circle:nth-child(3n+1){animation-delay:-1.1s}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
.night .lights circle{filter:drop-shadow(0 0 3px currentColor)}
.bunting{animation:flutter 4s ease-in-out infinite alternate}
@keyframes flutter{from{transform:translateY(0)}to{transform:translateY(1.5px)}}

.slot{cursor:pointer}
.slot text.nm{font-family:var(--font);font-weight:700;font-size:10px;fill:var(--ink)}
.pet *{transition:transform .5s ease, opacity .4s ease}
.walker,.bodyg,.upper,.head,.legs,.leg,.tail,.food,.mover,.fx *{transform-box:view-box}
.mover{transform-origin:0 0}
.upper,.legs{transform-origin:0 0}
.eye-c{opacity:0}
.fx>*{opacity:0}
.fx>.cl{opacity:1}
.fx .cloud{opacity:0;transition:opacity .5s}
.cloud{animation:bob 3s ease-in-out infinite}
.slot.has-note .fx .cloud.note{opacity:1}
.slot.yum .fx .cloud.yumc{opacity:1}
.slot.yum .fx .cloud.note{opacity:0}
.cloud.zzz text{letter-spacing:.02em}
.st-window .bodyg,.st-window .tail{animation:none}
.st-window .eye-o{opacity:0}.st-window .eye-c{opacity:1}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

.bodyg{transform-origin:0 0;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
.sp-dog .tail{transform-origin:-19px -27px;animation:wag 1.1s ease-in-out infinite}
.sp-cat .tail{transform-origin:-15px -21px;animation:catTail 3.5s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(16deg)}}
@keyframes catTail{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(8deg)}}

.st-eat .sp-dog .head{transform-origin:16px -30px;animation:eatDog .55s ease-in-out infinite alternate}
.st-eat .sp-cat .head{transform-origin:14px -26px;animation:eatCat .6s ease-in-out infinite alternate}
.st-eat .sp-turtle .head{transform-origin:18px -8px;animation:eatTurtle .5s ease-in-out infinite alternate}
@keyframes eatDog{from{transform:translate(4px,14px) rotate(36deg)}to{transform:translate(4px,15px) rotate(42deg)}}
@keyframes eatCat{from{transform:translate(5px,13px) rotate(34deg)}to{transform:translate(5px,14px) rotate(40deg)}}
@keyframes eatTurtle{from{transform:translate(6px,1px) rotate(12deg)}to{transform:translate(7px,3px) rotate(20deg)}}
.st-eat .sp-dog .tail{animation-duration:.4s}
.food{transform-origin:0 -8px}
.bowl.empty .food{opacity:0;transform:scaleY(.2)}
.st-eat .food{animation:eatFood 5.5s ease-in forwards}
@keyframes eatFood{0%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(.45,.3)}100%{opacity:0;transform:scale(.2,.1)}}
.st-eat .fx .hearts{animation:hearts 1.8s ease-out infinite}
.st-happy .fx .hearts{animation:hearts 2.4s ease-out 1}
@keyframes hearts{0%{opacity:0;transform:translateY(6px)}25%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

.st-refuse .legs,.st-sleep .legs{transform:scaleY(.18)}
.st-refuse .sp-dog .upper,.st-sleep .sp-dog .upper{transform:translateY(14px)}
.st-refuse .sp-cat .upper,.st-sleep .sp-cat .upper{transform:translateY(12px)}
.st-refuse .sp-dog .head,.st-sleep .sp-dog .head{transform-origin:16px -30px;transform:translate(2px,6px) rotate(14deg)}
.st-refuse .sp-cat .head,.st-sleep .sp-cat .head{transform-origin:14px -26px;transform:translate(1px,4px) rotate(10deg)}
.st-refuse .sp-turtle .head,.st-sleep .sp-turtle .head{transform-origin:18px -8px;transform:translateX(-11px) scale(.72)}
.st-refuse .sp-turtle .legs,.st-sleep .sp-turtle .legs{transform:scaleY(.5)}
.st-refuse .tail,.st-sleep .tail{animation:none}
.st-refuse .walker{transform:translateX(-4px) scaleX(-1)}
.st-sleep .bodyg{animation-duration:4.8s}
.st-sleep .eye-o{opacity:0}.st-sleep .eye-c{opacity:1}

.st-sniff .walker{animation:walkSniff 14s linear infinite}
.st-run .walker{animation:walkRun 5s linear infinite}
@keyframes walkSniff{0%{transform:translateX(-18px) scaleX(1)}46%{transform:translateX(22px) scaleX(1)}50%{transform:translateX(22px) scaleX(-1)}96%{transform:translateX(-18px) scaleX(-1)}100%{transform:translateX(-18px) scaleX(1)}}
@keyframes walkRun{0%{transform:translateX(-24px) scaleX(1)}46%{transform:translateX(28px) scaleX(1)}50%{transform:translateX(28px) scaleX(-1)}96%{transform:translateX(-24px) scaleX(-1)}100%{transform:translateX(-24px) scaleX(1)}}
.st-sniff .sp-dog .head{transform-origin:16px -30px;animation:sniff .7s ease-in-out infinite alternate}
@keyframes sniff{from{transform:translate(3px,10px) rotate(24deg)}to{transform:translate(3px,12px) rotate(30deg)}}
.st-sniff .leg,.st-run .leg{transform-box:fill-box;transform-origin:50% 0}
.st-sniff .lf1,.st-sniff .lb2{animation:legA .7s ease-in-out infinite alternate}
.st-sniff .lf2,.st-sniff .lb1{animation:legB .7s ease-in-out infinite alternate}
.st-run .lf1,.st-run .lf2{animation:legA .24s ease-in-out infinite alternate}
.st-run .lb1,.st-run .lb2{animation:legB .24s ease-in-out infinite alternate}
@keyframes legA{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes legB{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
.st-run .bodyg{animation:bounce .24s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.st-run .sp-dog .tail{animation-duration:.25s}
.st-run .sp-dog .head{transform-origin:16px -30px;transform:rotate(-6deg)}
.slot:is(.st-sniff,.st-run,.st-eat,.st-gohome,.st-comeout) .fx .cloud:is(.note,.yumc){opacity:0}
/* naar huis lopen en weer naar buiten komen */
.st-gohome .mover{animation:gohome 3.3s ease-in-out forwards}
.st-comeout .mover{animation:comeout 3.3s ease-in-out forwards}
@keyframes gohome{0%{transform:translate(0,0) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.55);opacity:0}}
@keyframes comeout{0%{transform:translate(var(--dx),var(--dy)) scale(.55);opacity:0}20%{opacity:1}100%{transform:translate(0,0) scale(1);opacity:1}}
.flip .walker{transform:scaleX(-1)}
.st-gohome .leg,.st-comeout .leg{transform-box:fill-box;transform-origin:50% 0}
.st-gohome .lf1,.st-gohome .lb2,.st-comeout .lf1,.st-comeout .lb2{animation:legA .3s ease-in-out infinite alternate}
.st-gohome .lf2,.st-gohome .lb1,.st-comeout .lf2,.st-comeout .lb1{animation:legB .3s ease-in-out infinite alternate}
.st-poke .walker{animation:poke .5s ease-in-out 2}
@keyframes poke{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const f = amt<0 ? (x=>Math.round(x*(1+amt))) : (x=>Math.round(x+(255-x)*amt));
  return '#'+[f(r),f(g),f(b)].map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,'0')).join('');
}

/* seizoen: december-lichtjes en karnaval (januari t/m dinsdag voor Aswoensdag) */
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da); }
function season(){
  if(S.season && S.season!=='auto') return S.season==='none' ? null : S.season;
  const d = nowDate(); if(d.getMonth()===11) return 'december';
  const shrove = easter(d.getFullYear()); shrove.setDate(shrove.getDate()-47); shrove.setHours(23,59);
  if(d >= new Date(d.getFullYear(),0,2) && d <= shrove) return 'carnival';
  return null;
}

/* ---------------- task generation (vragenlijst → taken) ---------------- */
function generateTasks(plan, date){
  const out = [], pets = plan.pets, petById = id => pets.find(p=>p.id===id), wd = date.getDay();
  for(const f of plan.feedings) for(const p of pets){
    const cup = f.portions[p.id] || 'none'; if(cup==='none') continue;
    const s = toMin(f.time);
    out.push({id:`feed:${f.id}:${p.id}`, kind:'feed', time_start:s, time_end:s+60, pet_ids:[p.id], pet_names:[p.name], params:{cup}});
  }
  for(const w of plan.walks){
    const dogs = w.dog_ids.map(petById).filter(p=>p && p.species==='dog'); if(!dogs.length) continue;
    const s = toMin(w.time);
    out.push({id:`walk:${w.id}`, kind:'walk', time_start:s, time_end:s+Math.max(60, Math.ceil(w.duration/60)*60), pet_ids:dogs.map(d=>d.id), pet_names:dogs.map(d=>d.name), params:{duration:w.duration}});
  }
  const has = sp => pets.some(p=>p.species===sp), C = plan.chores;
  const chore = (key, hm) => out.push({id:`chore:${key}`, kind:'chore', time_start:toMin(hm), time_end:null, pet_ids:[], pet_names:[], params:{chore:key}});
  if(C.water.on) chore('water', C.water.time);
  if(C.litter.on && has('cat')) chore('litter', C.litter.time);
  if(C.lamp.on && has('turtle')){ chore('lamp', C.lamp.time); chore('lamp_off', C.lamp.time_off); }
  if(C.plants.on) chore('plants', C.plants.time);
  if(C.mail.on) chore('mail', C.mail.time);
  if(C.kliko.on && Number(C.kliko.weekday)===wd) chore('kliko', C.kliko.time);
  if(C.close.on) chore('close', C.close.time);
  for(const m of plan.meds){ const p = petById(m.pet_id); if(!p) continue;
    out.push({id:`med:${m.id}`, kind:'med', time_start:toMin(m.time), time_end:null, pet_ids:[p.id], pet_names:[p.name], params:{text:m.text}}); }
  for(const c of plan.custom){ if(!c.text) continue;
    out.push({id:`custom:${c.id}`, kind:'custom', time_start:toMin(c.time), time_end:null, pet_ids:[], pet_names:[], params:{text:c.text}}); }
  out.forEach(x=>{ x.state='todo'; x.outcome=null; x.note=''; x.done_at=null; x.later_at=null; });
  out.sort((a,b)=> a.time_start-b.time_start || kindOrder(a)-kindOrder(b));
  return out;
}
const kindOrder = x => ({feed:0,med:1,walk:2,chore:3,custom:4})[x.kind] ?? 9;
const EMPTY_DAY = {date:'', tasks:[]};
function today(){
  const k = dateKey(nowDate());
  if(S.days[k]) return S.days[k];
  /* zonder boeking voor vandaag maken we geen takenlijst aan */
  if(!bookingDay(k)){ EMPTY_DAY.date = k; EMPTY_DAY.tasks = []; return EMPTY_DAY; }
  S.days[k] = {date:k, tasks:generateTasks(S.plan, nowDate())}; save();
  return S.days[k];
}
function rebuildToday(){
  const d = today(), fresh = generateTasks(S.plan, nowDate()), old = new Map(d.tasks.map(x=>[x.id,x]));
  fresh.forEach(x=>{ const o = old.get(x.id); if(o) Object.assign(x, {state:o.state,outcome:o.outcome,note:o.note,done_at:o.done_at,later_at:o.later_at}); });
  d.tasks.forEach(o=>{ if(o.state==='done' && !fresh.some(x=>x.id===o.id)) fresh.push(o); });
  fresh.sort((a,b)=> a.time_start-b.time_start || kindOrder(a)-kindOrder(b));
  d.tasks = fresh;
}

/* ---------------- status: groen / oranje / rood ----------------
   rood   = een taak waarvan het tijdvenster voorbij is, is nog niet gedaan
   oranje = gedaan, maar met een (ongelezen) opmerking of 'niet gegeten'

const dueEnd = x => x.time_end ?? (x.time_start + 30);
const dismissKey = (date, x) => date+'/'+x.id;
const noteAt = x => x.later_at || x.done_at || null;
function isRead(role, iso){ const r = S.read && S.read[role]; return !!(r && iso && r >= iso); }
/* alle berichten en opmerkingen door elkaar, op tijd gesorteerd */
function stream(){
  const d = today();
  const notes = d.tasks.filter(x=>x.note && noteAt(x)).map(x=>({id:'n_'+x.id, from:'sitter', text:x.note, at:noteAt(x), task:taskTitle(x)}));
  return [...(S.chat||[]), ...notes].sort((a,b)=> (a.at||'').localeCompare(b.at||''));
}
function unreadItems(role){ return stream().filter(it => (it.system ? role==='owner' : it.from !== role) && !isRead(role, it.at)); }
function markRead(role){ S.read = S.read || {}; S.read[role] = nowDate().toISOString(); save(); }
function taskStatus(x, m, date){
  if(x.state!=='done') return m >= dueEnd(x) ? 'late' : 'open';
  const unread = x.note && !isRead('owner', noteAt(x));
  if(unread || x.outcome==='refused' || x.outcome==='skipped') return 'note';
  return 'ok';
}
const RANK = {open:0, ok:1, note:2, late:3};
const groupOf = x => x.kind==='feed' ? 'feed' : x.kind==='walk' ? 'walk' : 'care';
function groupStatus(tasks, m, date){
  let worst = 'open', culprit = null;
  tasks = tasks.filter(x=>!taskOff(x));
  for(const x of tasks){ if(x.state!=='done' && m < dueEnd(x)) continue;
    const s = taskStatus(x,m,date); if(RANK[s] > RANK[worst] || (s==='note' && worst==='note' && x.outcome==='refused')){ worst = s; culprit = x; } }
  const next = tasks.find(x=>x.state!=='done' && m < dueEnd(x));
  return {status:worst, culprit, next, done:tasks.filter(x=>x.state==='done').length, total:tasks.length};
}
function petStatus(p, d, m){ return groupStatus(d.tasks.filter(x=>x.pet_ids.includes(p.id)), m, d.date).status; }
function petHasCloud(p, d){
  const note = d.tasks.some(x=>x.pet_ids.includes(p.id) && x.note && !isRead('owner', noteAt(x)));
  const lf = lastFeed(p,d); return note || !!(lf && lf.outcome==='refused');
}

/* ---------------- pet state for the scene ---------------- */
const transient = {};
function lastFeed(p, d){
  const f = d.tasks.filter(x=>x.kind==='feed' && x.pet_ids[0]===p.id && x.state==='done').sort((a,b)=> (a.done_at||'').localeCompare(b.done_at||''));
  return f[f.length-1];
}
/* slapen: 22:00 – 06:00, tenzij het dier in die periode al een activiteit had */
const minOfIso = iso => { const d = new Date(iso); return d.getHours()*60+d.getMinutes(); };
const BEDTIME = 21*60, WAKE = 6*60;
function isAsleep(p, d){
  const m = nowMin(); if(!(m >= BEDTIME || m < WAKE)) return false;
  const from = m >= BEDTIME ? BEDTIME : 0;
  return !d.tasks.some(x=>x.pet_ids.includes(p.id) && x.state==='done' && [x.done_at, x.later_at].some(t=>t && minOfIso(t) >= from && minOfIso(t) <= m));
}
function petState(p, d){
  const tr = transient[p.id];
  if(tr && tr.until > Date.now()) return tr.state;
  if(isAsleep(p,d)) return 'sleep';
  const last = lastFeed(p,d);
  if(last && last.outcome==='refused') return 'refuse';
  if(tr && tr.state==='eat') return 'happy';
  return 'idle';
}
function bowlFull(p, d){
  const tr = transient[p.id];
  if(tr && tr.until > Date.now() && tr.state==='eat') return true;
  const last = lastFeed(p,d); return !!(last && last.outcome==='refused');
}
function play(petIds, state, ms){
  const until = Date.now()+ms;
  petIds.forEach(id => transient[id] = {state, until});
  renderScene();
  setTimeout(()=>{ renderScene(); if(state==='eat') petIds.forEach((id,i)=>setTimeout(()=>showYum(id), i*300)); }, ms+60);
}

/* "Lekker!" – willekeurig bij één dier dat net gegeten heeft; wisselt tussen de eters */
let yum = {id:null, until:0};
function yumCandidates(){
  const d = today(), now = nowDate().getTime();
  return S.plan.pets.filter(p=>{
    if(petState(p,d)!=='idle' && petState(p,d)!=='happy') return false;
    const f = lastFeed(p,d); if(!f || !(f.outcome==='ate' || f.outcome==='ate_later')) return false;
    const at = new Date(f.later_at || f.done_at).getTime();
    return now - at < 30*60*1000 && now - at >= -60000;
  }).map(p=>p.id);
}
function showYum(id){ yum = {id, until:Date.now()+3800}; applyYum(); setTimeout(applyYum, 3900); }
function applyYum(){
  document.querySelectorAll('.slot.yum').forEach(el=>el.classList.remove('yum'));
  if(yum.id && yum.until > Date.now()) document.querySelector(`.slot[data-pet="${yum.id}"]`)?.classList.add('yum');
}
function yumTick(){
  if(yum.until > Date.now()) return;
  const c = yumCandidates(); if(!c.length || Math.random() < .35) return;
  const pool = c.length > 1 ? c.filter(id=>id!==yum.id) : c;
  showYum(pool[Math.floor(Math.random()*pool.length)]);
}

function cloudSVG(text, cls, stroke, tail){
  const fs = 10, h = 20, r = h/2, w = Math.max(34, text.length*fs*.56 + 18);
  const x0 = -w/2 + r, x1 = w/2 - r, top = (x1-x0)/3, bot = (x1-x0)/2;
  let d = `M${x0} ${r} A${r} ${r} 0 0 1 ${x0} ${-r}`;
  for(let k=1;k<=3;k++) d += ` A${top/2} ${top/2*.75} 0 0 1 ${x0+top*k} ${-r}`;
  d += ` A${r} ${r} 0 0 1 ${x1} ${r}`;
  for(let k=1;k<=2;k++) d += ` A${bot/2} ${bot/2*.35} 0 0 1 ${x1-bot*k} ${r}`;
  d += 'Z';
  const body = text==='…' ? `<circle cx="-5" cy="0" r="1.5" fill="${stroke}"/><circle cx="0" cy="0" r="1.5" fill="${stroke}"/><circle cx="5" cy="0" r="1.5" fill="${stroke}"/>`
    : `<text x="0" y="3.6" text-anchor="middle" font-family="Figtree,sans-serif" font-weight="700" font-size="${fs}" fill="#16323D">${text}</text>`;
  const tx = tail==='right' ? w/2-8 : -w/2+8, dir = tail==='right' ? 1 : -1;
  return `<g class="cloud ${cls}">
    <circle cx="${tx}" cy="${r+6}" r="2.4" fill="#fff" stroke="${stroke}" stroke-width=".9"/>

}

  dawn: {skyTop:'#F2B3A6', skyBot:'#FDE6C8', seaTop:'#86BFD3', seaBot:'#3F88AE', foam:'#FFF3E6', veil:.06, stars:0},
  day:  {skyTop:'#8ED3EE', skyBot:'#E4F5F8', seaTop:'#47B9D5', seaBot:'#1E86B3', foam:'#F2FBFC', veil:0, stars:0},
  sunset:{skyTop:'#EE8A62', skyBot:'#FFD59E', seaTop:'#E3966F', seaBot:'#5B5F8E', foam:'#FFE3C8', veil:.1, stars:0},
  dusk: {skyTop:'#33396B', skyBot:'#C27A8C', seaTop:'#4D5883', seaBot:'#22335A', foam:'#A7A9CC', veil:.24, stars:.5},
};
const SKY_KEYS = [[0,'night'],[330,'night'],[390,'dawn'],[480,'day'],[1050,'day'],[1125,'sunset'],[1180,'dusk'],[1250,'night'],[1440,'night']];
function mixHex(a,b,f){ const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16);
  return '#'+[16,8,0].map(sh=>Math.round(((A>>sh)&255)*(1-f)+((B>>sh)&255)*f).toString(16).padStart(2,'0')).join(''); }
function skyAt(m){
  let i=0; while(i < SKY_KEYS.length-2 && m >= SKY_KEYS[i+1][0]) i++;
  const [m0,k0] = SKY_KEYS[i], [m1,k1] = SKY_KEYS[i+1], f = m1===m0 ? 0 : Math.min(1, Math.max(0,(m-m0)/(m1-m0)));
  const a = SKY[k0], b = SKY[k1], o = {};
  for(const key in a) o[key] = typeof a[key]==='number' ? a[key]*(1-f)+b[key]*f : mixHex(a[key], b[key], f);
  // zon: 06:00 → 19:15, zakt achter de horizon; maan: 19:00 → 06:00
  const sunT = (m-360)/(1155-360); o.sun = sunT>0 && sunT<1 ? [22+sunT*346, HOR - Math.sin(Math.PI*sunT)*108] : null;
  const mm = m >= 1140 ? m-1140 : m+300, moonT = mm/660; o.moon = moonT>0 && moonT<1 ? [22+moonT*346, HOR - Math.sin(Math.PI*moonT)*100] : null;
  o.dark = o.veil > .15;
  return o;
}

  OPENINGS.forEach((o,i)=>{
    const pet = sleepers[i];
    const clip = `op${i}`;
    if(o.kind==='round'){
      defs += `<clipPath id="${clip}"><circle cx="${o.cx}" cy="${o.cy}" r="${o.r}"/></clipPath>`;
      out += `<circle cx="${o.cx}" cy="${o.cy}" r="${o.r+2.5}" fill="${frame}"/><circle cx="${o.cx}" cy="${o.cy}" r="${o.r}" fill="${glass}"/>`;
    } else {
      const arch = (x,y,w,h) => `M${x} ${y+w/2} a${w/2} ${w/2} 0 0 1 ${w} 0 V${y+h} H${x} Z`;
      defs += `<clipPath id="${clip}">${o.kind==='door' ? `<path d="${arch(o.x,o.y,o.w,o.h)}"/>` : `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="3"/>`}</clipPath>`;
      const fill = o.kind==='door' ? (pet ? (lit?'#E9C170':'#6B7F8C') : '#2C9CC6') : glass;
      out += o.kind==='door'
        ? `<path d="${arch(o.x-2.5,o.y-2.5,o.w+5,o.h+2.5)}" fill="${frame}"/><path d="${arch(o.x,o.y,o.w,o.h)}" fill="${fill}"/>`
        : `<rect x="${o.x-2.5}" y="${o.y-2.5}" width="${o.w+5}" height="${o.h+5}" rx="4" fill="${frame}"/>
           <rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="3" fill="${fill}"/>`;
      if(o.kind==='door' && !pet) out += `<circle cx="${o.x+o.w-5}" cy="${o.y+o.h*.6}" r="1.6" fill="#FBFAF6"/>`;
    }
    if(pet){
      const [hx,hy] = HEAD[pet.species], s = o.kind==='round' ? .72 : .84;
      const cx = o.kind==='round' ? o.cx : o.x+o.w/2, cy = o.kind==='round' ? o.cy+2 : o.y + (o.kind==='door' ? 14 : o.h/2+2);
      out += `<g clip-path="url(#${clip})"><g class="slot st-window" transform="translate(${(cx-hx*s).toFixed(1)},${(cy-hy*s+3).toFixed(1)}) scale(${s})"><g class="walker">${petSVG(pet, se)}</g></g></g>`;
    }
    if(o.kind==='win' && !pet) out += `<path d="M${o.x+o.w/2} ${o.y} V${o.y+o.h} M${o.x} ${o.y+o.h/2} H${o.x+o.w}" stroke="${frame}" stroke-width="2"/>`;
  });
  const clouds = sleepers.map((pet,i)=> pet ? `<g transform="translate(${OPENINGS[i].cloud[0]},${OPENINGS[i].cloud[1]})">${cloudSVG('Z z z','zzz on','#CFD8E3', OPENINGS[i].cloud[0] > 300 ? 'left' : 'right')}</g>` : '').join('');
  return {defs, out, clouds};
}
function sceneSVG(){
  const d = today(), m = nowMin(), se = season(), sky = skyAt(m);
  const pets = S.plan.pets.slice(0,4), n = Math.max(1, pets.length);
  const sc = SCALE[Math.min(4,n)], spots = SPOTS[Math.min(4,n)];
  const sleepers = [];
  const slots = pets.map((p,i)=>{
    let st = petState(p,d);
    const [x, gy] = spots[i];
    const place = st==='sleep' ? 'home' : 'beach';
    // overgang tijdens het kijken: naar huis lopen of naar buiten komen
    if(lastPlace[p.id] && lastPlace[p.id]!==place && !(transient[p.id] && transient[p.id].until > Date.now())){
      transient[p.id] = {state: place==='home' ? 'gohome' : 'comeout', until: Date.now()+3400};
      setTimeout(()=>renderScene(), 3460);
      st = transient[p.id].state;
    }
    lastPlace[p.id] = place;
    const full = bowlFull(p,d);
    if(st==='sleep'){ sleepers.push(p); return `<g transform="translate(${x},${gy}) scale(${sc})">${bowlSVG(p, full)}</g>`; }
    const ps = petStatus(p,d,m);
    const col = {ok:'var(--ok)', note:'var(--note)', late:'var(--late)', open:'var(--idle)'}[ps];
    const nameW = p.name.length*6+22;
    const dx = (HOUSE.door[0]-x)/sc, dy = (HOUSE.door[1]-gy)/sc;
    const moving = st==='gohome' || st==='comeout';
    const flip = (st==='gohome' && dx<0) || (st==='comeout' && dx>0);
    const hasNote = petHasCloud(p,d);
    return `<g class="slot st-${st} ${flip?'flip':''} ${hasNote?'has-note':''}" data-pet="${p.id}" transform="translate(${x},${gy}) scale(${sc})" style="--dx:${dx.toFixed(1)}px;--dy:${dy.toFixed(1)}px" role="img" aria-label="${esc(p.name)}: ${t('st_'+st)}">
      ${moving?'':`<ellipse cx="6" cy="1" rx="30" ry="3.5" fill="var(--sand-2)" opacity=".7"/>`}
      ${bowlSVG(p, full)}
      <g class="mover"><g class="walker">${petSVG(p, se)}</g>${fxSVG(p, sc, st==='refuse')}</g>
      ${moving?'':`<g transform="translate(6,15) scale(${(1/sc).toFixed(3)})">
        <rect x="${-nameW/2}" y="-8" width="${nameW}" height="16" rx="8" fill="var(--surface)" opacity=".92"/>
        <circle cx="${-nameW/2+9}" cy="0" r="3.5" fill="${col}"/>
        <text class="nm" x="${-nameW/2+16}" y="3.5">${esc(p.name)}</text></g>`}
    </g>`;
  });
  // achterste rij eerst tekenen, dan de voorste (diepte)
  const order = spots.map((sp,i)=>[sp[1],i]).sort((a,b)=>a[0]-b[0]).map(a=>a[1]);
  const slotsSorted = order.map(i=>slots[i]).join('');
  const op = openingsSVG(sky, sleepers, se);
  const bunting = se==='carnival' ? `<g class="bunting"><path d="M52 186 Q170 232 288 168" stroke="#8A7A62" stroke-width="1" fill="none"/>
      ${Array.from({length:12},(_,i)=>{const u=(i+.5)/12, x=(1-u)*(1-u)*52+2*(1-u)*u*170+u*u*288, y=(1-u)*(1-u)*186+2*(1-u)*u*232+u*u*168;
        return `<path d="M${(x-5).toFixed(1)} ${y.toFixed(1)} L${(x+5).toFixed(1)} ${y.toFixed(1)} L${x.toFixed(1)} ${(y+10).toFixed(1)}Z" fill="${PARTY[i%PARTY.length]}"/>`}).join('')}</g>` : '';
  const shore = 226;
  return `<svg viewBox="0 0 ${W} ${H}" class="${sky.dark?'night':''}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky.skyTop}"/><stop offset="1" stop-color="${sky.skyBot}"/></linearGradient>
      <linearGradient id="seag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky.seaTop}"/><stop offset="1" stop-color="${sky.seaBot}"/></linearGradient>
      <linearGradient id="fadeg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sand)" stop-opacity="0"/><stop offset="1" stop-color="var(--bg)"/></linearGradient>
      ${op.defs}
      <mask id="moonm"><circle r="14" fill="#fff"/><circle cx="6" cy="-5" r="11" fill="#000"/></mask>
    </defs>
    <rect width="${W}" height="${HOR+2}" fill="url(#skyg)"/>
    <g opacity="${sky.stars.toFixed(2)}" fill="#F4EBCB"><circle cx="40" cy="70" r="1.2"/><circle cx="96" cy="96" r="1"/><circle cx="160" cy="64" r="1.3"/><circle cx="214" cy="104" r="1"/><circle cx="262" cy="58" r="1.1"/><circle cx="330" cy="88" r="1"/><circle cx="366" cy="120" r="1.2"/><circle cx="130" cy="134" r="1"/></g>
    ${sky.sun ? `<g><circle cx="${sky.sun[0].toFixed(1)}" cy="${sky.sun[1].toFixed(1)}" r="26" fill="#FFF1C9" opacity=".6"/><circle cx="${sky.sun[0].toFixed(1)}" cy="${sky.sun[1].toFixed(1)}" r="16" fill="#F8CF6E"/></g>` : ''}
    ${sky.moon ? `<g transform="translate(${sky.moon[0].toFixed(1)},${sky.moon[1].toFixed(1)})"><circle r="20" fill="#F4EBCB" opacity=".12"/><circle r="13" fill="#F4EBCB" mask="url(#moonm)"/></g>` : ''}
    <path d="M0 ${HOR} H${W} V${shore} Q${W*.75} ${shore-8} ${W/2} ${shore} T0 ${shore}Z" fill="url(#seag)"/>
    <path class="wave" d="M-20 ${HOR+12} q15 -4 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" stroke="${sky.foam}" stroke-width="1.4" fill="none" opacity=".45"/>
    <path class="wave w2" d="M-10 ${HOR+30} q15 -4 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" stroke="${sky.foam}" stroke-width="1.2" fill="none" opacity=".35"/>
    <path d="M0 ${shore-2} Q${W*.25} ${shore-10} ${W/2} ${shore-2} T${W} ${shore-2} V${H} H0Z" fill="var(--sand)"/>
    <path class="wave" d="M-10 ${shore-2} Q${W*.25} ${shore-10} ${W/2} ${shore-2} T${W+10} ${shore-2}" stroke="${sky.foam}" stroke-width="3" fill="none" opacity=".85"/>
    <path d="M0 ${shore+8} Q${W*.25} ${shore} ${W/2} ${shore+8} T${W} ${shore+8} V${shore+26} Q${W*.6} ${shore+18} 0 ${shore+24}Z" fill="#E3CFA6" opacity=".35"/>
    ${houseSVG()}
    <g transform="translate(378,284)"><g fill="var(--cactus)"><rect x="-5" y="-56" width="11" height="56" rx="5.5"/><rect x="-16" y="-38" width="8" height="22" rx="4"/>
      <rect x="-12" y="-22" width="10" height="6" rx="3"/></g><path d="M.5 -52 V-4" stroke="var(--cactus-2)" stroke-width="1.2"/></g>
    ${palmSVG(se)}
    <path d="M334 396 q5 -9 10 0 z" fill="#F6E7DA" stroke="#E2C9B4"/><circle cx="210" cy="296" r="2.4" fill="#F3DCCB"/><circle cx="20" cy="360" r="2" fill="#F3DCCB"/>
    ${bunting}
    <rect width="${W}" height="${H}" fill="#06182B" opacity="${sky.veil.toFixed(3)}" pointer-events="none"/>
    ${op.out}
    ${slotsSorted}
    ${op.clouds}
    <rect y="${H-14}" width="${W}" height="14" fill="url(#fadeg)" pointer-events="none"/>
  </svg>`;
}
function renderScene(){
  $('#scene').innerHTML = sceneSVG();
  const act = isActive();
  $('#sceneWrap').classList.toggle('inactive', !act);
  const msg = $('#sceneWrap').querySelector('.veilmsg'); if(msg) msg.remove();
  applyYum();
  const d = today(), done = d.tasks.filter(x=>x.state==='done').length;
  $('#progFill').style.width = (d.tasks.length ? Math.round(done/d.tasks.length*100) : 0)+'%';
  document.querySelector('.top').classList.toggle('light', skyAt(nowMin()).dark);
}
function renderHeader(){
  $('#hSub').textContent = 'Curaçao · ' + fmtDay(today().date);
  $('#roleBtn').textContent = t(S.role) + ' ⇄';
  $('#roleBtn').setAttribute('aria-label', t('view_as')+': '+t(S.role));

/* ---------------- views ---------------- */
let openTask = null;
const ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function viewToday(){
  /* zonder boeking voor vandaag: geen takenlijst en geen berichten */
  if(!cur() || !bookingToday()) return bannerHTML();
  return bannerHTML() + inboxSection() + (S.role === 'owner' ? viewOwner() : viewSitter());
}
/* één vak: het laatste ongelezen bericht of de laatste opmerking, of de chat zelf */
function inboxSection(){
  const title = S.role === 'owner' ? t('notes_title') : t('notes_title_owner');
  if(chatOpen) return `<section class="sec" id="cardsSec"><h2>${title}<span><button class="lnk" data-act="chat-close">${t('hide')}</button></span></h2>${chatBox()}</section>`;
  const un = unreadItems(S.role), last = un[un.length-1];
  const body = last
    ? `<button class="card" data-act="open-chat">
        <div class="av">${last.task ? petAvatar((today().tasks.find(x=>taskTitle(x)===last.task)||{pet_ids:[]}).pet_ids[0]) : ICON_PERSON}</div>
        <div><div class="meta"><b>${last.system ? t('app_name') : esc(last.from==='owner'?ownerName():sitterName())}</b> · ${hmOf(last.at)}${last.task?` · ${esc(t('about_task',{task:last.task}))}`:''}</div><p>${esc(last.text)}</p></div>
        ${un.length>1?`<span class="pill acc">${un.length}</span>`:''}</button>`
    : `<button class="card empty-card" data-act="open-chat"><div class="av">${ICON_PERSON}</div><div><p class="muted">${t('no_cards')}</p></div></button>`;
  return `<section class="sec" id="cardsSec"><h2>${title}</h2><div class="cards">${body}</div></section>`;

/* melding bovenaan: geen boeking, nieuwe aanvraag of nog niet ingecheckt */
function bannerHTML(){
  const c = cur(), day = bookingToday();
  if(!c || !day)
    return `<div class="bcard"><h3>${t('bk_none')}</h3><p class="sub">${t('bk_none_s')}</p>
      <div class="brow"><button class="btn ghost" data-act="go-booking">${t('bk_to_booking')}</button></div></div>`;
  if(c.state!=='active')
    return `<div class="bcard"><h3>${t('bk_not_started')} <span class="pill acc">${fmtShort(day.date)} ${day.start}</span></h3>
      ${S.role==='sitter' ? `<div class="brow"><button class="btn" data-act="bk-checkin">${t('bk_checkin')}</button></div>` : ''}</div>`;
  return '';
}

/* chat tussen oppas en eigenaar */
let chatAll = false, chatOpen = false;
const ICON_PERSON = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="1.8"><circle cx="12" cy="9" r="3.4"/><path d="M5 20c.8-3.8 3.6-5.4 7-5.4s6.2 1.6 7 5.4"/></svg>';
const ICON_SEND = '<svg viewBox="0 0 24 24"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg>';
function chatBox(){
  const other = S.role==='owner' ? sitterName() : ownerName();
  const all = stream(), list = chatAll ? all : all.slice(-6);
  return `<div class="chat">
      ${all.length>6 && !chatAll ? `<button class="lnk" style="margin:10px 14px 0" data-act="chat-all">${t('chat_all',{n:all.length})}</button>` : ''}
      <div class="msgs" id="msgs">${list.length ? list.map(mm=>`<div class="msg ${mm.from===S.role && !mm.system?'me':''} ${mm.task?'note':''} ${mm.system?'sys':''}">${mm.task?`<i>${esc(mm.task)}</i>`:''}<p>${esc(mm.text)}</p><time>${mm.system ? t('app_name') : mm.from===S.role ? t('me') : esc(mm.from==='owner'?ownerName():sitterName())} · ${hmOf(mm.at)}</time></div>`).join('') : `<p class="sub muted" style="padding:4px 2px">${t('chat_empty')}</p>`}</div>
      <form class="chatin" id="chatForm" autocomplete="off"><input id="chatInput" type="text" placeholder="${t('chat_ph',{who:esc(other)})}"><button class="send" type="submit" aria-label="${t('chat')}">${ICON_SEND}</button></form>
    </div>`;
}

function viewSitter(){
  const d = today(), m = nowMin(), live = liveTasks(d);
  const doneN = live.filter(x=>x.state==='done').length;
  const rows = d.tasks.map(x=>{
    const off = taskOff(x);
    const isNow = !off && x.state!=='done' && m >= x.time_start && m < dueEnd(x);
    const late = !off && x.state!=='done' && m >= dueEnd(x);
    const warn = x.kind==='feed' && x.outcome==='refused';
    const exp = openTask===x.id, det = taskDetail(x);
    const offLbl = off==='before' ? t('bk_before') : off==='outside' ? t('bk_outside') : '';
    const sub = [esc(det), offLbl?`<i class="offlbl">${offLbl}</i>`:''].filter(Boolean).join(' · ');
    return `<div class="task ${x.state==='done'?'done':''} ${warn?'warn':''} ${isNow?'now':''} ${late?'late':''} ${off?'off':''}" data-task="${x.id}">
      <div class="task-row">
        <button class="rowmain" data-act="toggle" aria-expanded="${exp}">
          <span class="tm">${toHM(x.time_start)}</span>
          <span class="tt"><b data-now="${t('now')}">${esc(taskTitle(x))}</b>${sub?`<span>${sub}</span>`:''}${x.note && !exp ? `<span>“${esc(x.note)}”</span>`:''}</span>
        </button>
        <button class="checkbtn" data-act="tick" aria-label="${x.state==='done'?t('undo'):t('mark_done')}"><span class="check">${ICON_CHECK}</span></button>
      </div>${exp ? taskExpand(x) : ''}</div>`;
  }).join('');
  const P = S.plan;
  const notes = (P.notes || P.vet.name) ? `<section class="sec"><h2>${t('q_notes')}</h2><div class="panel">
      ${P.notes?`<p class="sub">${esc(P.notes)}</p>`:''}
      ${P.vet.name?`<p class="sub"><b>${t('vet_short')}:</b> ${esc(P.vet.name)}${P.vet.phone?` · <a href="tel:${esc(P.vet.phone.replace(/\s/g,''))}">${esc(P.vet.phone)}</a>`:''}</p>`:''}
    </div></section>` : '';
  return `<section class="sec"><h2>${t('today')} <span>${doneN} / ${live.length} ${t('done')}</span></h2>
    ${rows ? `<div class="list">${rows}</div>` : `<div class="empty">${t('no_tasks')}</div>`}</section>${notes}`;
}
/* opmerkingen zijn optioneel: standaard alleen afvinken */
let openCmt = null;
function taskExpand(x){
  const special = x.outcome && !['ate','sniff','done'].includes(x.outcome);
  if(openCmt !== x.id && !x.note && !special)
    return `<div class="task-x"><button class="btn ghost sm" data-act="cmt">${t('comments_add')}</button>
      ${x.state==='done'?`<button class="lnk" data-act="undo">${t('undo')}</button>`:''}</div>`;
  let opts = '';
  if(x.kind==='feed'){
    opts = (x.outcome==='refused' || x.outcome==='ate_later')
      ? `<div class="opts mini"><button class="opt sel warn" data-act="noop">${t('refused')}</button>
         <button class="opt ${x.outcome==='ate_later'?'sel':''}" data-act="out" data-v="ate_later">${t('ate_later')}${x.later_at?`<small>${hmOf(x.later_at)}</small>`:''}</button></div>`
      : `<div class="opts mini"><button class="opt ${x.outcome==='ate'?'sel':''}" data-act="out" data-v="ate">${t('ate')}</button>
         <button class="opt" data-act="out" data-v="refused">${t('refused')}</button></div>`;
  } else if(x.kind==='walk'){
    opts = `<div class="opts mini"><button class="opt full ${x.outcome==='skipped'?'sel warn':''}" data-act="out" data-v="${x.outcome==='skipped'?'sniff':'skipped'}">${t('walk_skip')}</button></div>`;
  }
  return `<div class="task-x">${opts}
    <textarea data-note="${x.id}" placeholder="${t('note_ph')}" rows="2">${esc(x.note)}</textarea>
    <div class="brow"><button class="lnk" data-act="cmt-close">${t('hide')}</button>
    ${x.state==='done'?`<button class="lnk" data-act="undo">${t('undo')}</button>`:''}</div></div>`;
}

function petAvatar(id){
  const p = S.plan.pets.find(q=>q.id===id);
  if(!p) return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="var(--idle)"/></svg>';
  const vb = p.species==='turtle' ? '-2 -26 40 26' : p.species==='cat' ? '4 -50 36 30' : '4 -54 44 30';
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid slice"><g class="slot st-idle"><g class="walker">${petSVG(p)}</g></g></svg>`;
}
function viewOwner(){
  const d = today(), m = nowMin();
  const groups = [['feed','g_feed'],['walk','g_walk'],['care','g_care']].map(([g,label])=>{
    const tasks = d.tasks.filter(x=>groupOf(x)===g); if(!tasks.length) return '';
    const gs = groupStatus(tasks, m, d.date);
    let line;
    if(gs.status==='late') line = t('s_late',{task:taskTitle(gs.culprit)+' ('+toHM(gs.culprit.time_start)+')'});
    else if(gs.status==='note') line = gs.culprit.outcome==='refused' ? t('s_refused',{pet:currentNames(gs.culprit)[0]}) : gs.culprit.outcome==='skipped' ? t('walk_skip') : t('s_note');
    else if(gs.status==='ok') line = t('s_ok') + (gs.next ? ' · '+t('s_wait',{time:toHM(gs.next.time_start)}).toLowerCase() : '');
    else line = gs.next ? t('s_wait',{time:toHM(gs.next.time_start)}) : t('s_none');
    return `<div class="st ${gs.status}"><span class="d"></span><div><b>${t(label)}</b><small>${esc(line)}</small></div><em>${gs.done}/${gs.total}</em></div>`;
  }).join('');
  const all = d.tasks.map(x=>{ const st = taskStatus(x,m,d.date), extra = ownerExtra(x);
    return `<div class="lrow"><span class="d ${st==='open'?'':st}"></span><span class="tm">${toHM(x.time_start)}</span><span>${esc(taskTitle(x))}${extra?` <span class="muted">· ${esc(extra)}</span>`:''}</span></div>`; }).join('');
  return `<section class="sec"><div class="status">${groups || `<div class="st"><span class="d"></span><div><b>${t('no_tasks')}</b></div></div>`}</div></section>
    <details class="all"><summary>${t('all_tasks',{n:d.tasks.length})}</summary><div style="margin-top:6px">${all}</div></details>`;
}

/* achter een taak alleen wat de oppas echt heeft gekozen of geschreven */
function ownerExtra(x){
  if(x.state!=='done') return '';
  if(x.note) return '“'+x.note+'”';
  if(x.outcome==='refused') return t('refused');
  if(x.outcome==='ate_later') return t('ate_later')+' · '+hmOf(x.later_at);
  if(x.outcome==='skipped') return t('walk_skipped');
  return '';
}

function viewLog(){
  const keys = Object.keys(S.days).sort().reverse();
  const items = keys.map((k,i)=>{
    const d = S.days[k], done = d.tasks.filter(x=>x.state==='done').length;
    const rows = d.tasks.map(x=>`<div class="lrow"><span class="d ${x.state==='done'?(x.note||x.outcome==='refused'?'note':'ok'):''}"></span><span class="tm">${x.state==='done'?hmOf(x.later_at||x.done_at):'—'}</span>
      <span>${esc(taskTitle(x))}${outcomeText(x)?` <span class="muted">· ${esc(outcomeText(x))}</span>`:''}${x.note?`<div class="muted">“${esc(x.note)}”</div>`:''}</span></div>`).join('');
    return `<details class="day" ${i===0?'open':''}><summary><b>${fmtDay(k)}</b><span class="muted">${t('tasks_done',{a:done,b:d.tasks.length})}</span></summary><div class="inner">${rows}</div></details>`;
  }).join('');
  return `<section class="sec"><h2>${t('log')}</h2><p class="sub" style="margin-bottom:10px">${t('log_intro')}</p><div style="display:flex;flex-direction:column;gap:10px">${items}</div></section>`;
}

/* ---------------- boekingsscherm ---------------- */
let openBooking = null, openSitter = null, showForm = false;
function bkForm(){
  const k = dateKey(nowDate());
  const f = S.bkform = S.bkform || {type:'single', date:k, start:'08:00', end:'18:00', date2:k, rows:[{date:k, start:'08:00', end:'18:00'}], sitter_ids:[]};
  f.type = f.type || 'single'; f.sitter_ids = f.sitter_ids || [];
  return f;
}
function buildDays(){
  const f = bkForm(), out = [];
  if(f.type==='single') out.push({date:f.date, start:f.start, end:f.end});
  else if(f.type==='range'){
    const a = new Date(f.date+'T00:00'), z = new Date(f.date2+'T00:00');
    for(let d = new Date(a), i=0; d <= z && i < 60; d.setDate(d.getDate()+1), i++) out.push({date:dateKey(d), start:f.start, end:f.end});
  } else out.push(...f.rows.filter(r=>r.date).map(r=>({date:r.date, start:r.start, end:r.end})));
  return out;
}
function viewBooking(){
  if(!S.user_type) return `<section class="sec"><h2>${t('bk_who')}</h2><div class="cards">
    <button class="choice" data-act="ut" data-v="owner"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M9.5 21v-5h5v5"/></svg><span><b>${t('bk_find')}</b><span>${t('bk_find_s')}</span></span></button>
    <button class="choice" data-act="ut" data-v="sitter"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c.8-4.2 4-6 7.5-6s6.7 1.8 7.5 6"/></svg><span><b>${t('bk_offer')}</b><span>${t('bk_offer_s')}</span></span></button>
  </div></section>`;
  return S.role==='owner' ? bookingOwner() : bookingSitter();
}
const bkPill = st => ({none:'', requested:'note', accepted:'acc', active:'ok', declined:'warn', done:''})[st] || '';
function bkDays(b){
  return `<div class="daylist">${(b.days||[]).map(d=>`<div class="dayrow"><span>${fmtShort(d.date)}</span><span class="muted">${d.start} – ${d.end}</span><span></span></div>`).join('')}</div>`;

function invitedText(b){
  if(!b.sitter_ids.length) return t('bk_any');
  return b.sitter_ids.map(id=>(sitterById(id)||{}).name).filter(Boolean).join(', ');
}
/* kaartje van een oppas: naam, buurten, ervaring, beoordeling en intro */

  const open = openSitter===x.id;
  return `<div class="bcard sitter ${picked?'picked':''}" data-sitter="${x.id}">
    <button class="sitterhead" data-act="bk-sitter-open">
      <span class="ava">${x.name[0]}</span>
      <span><b>${esc(x.name)}</b><span class="sub">${x.hoods.slice(0,3).join(', ')}</span></span>
      <span class="rate"><span class="st">${stars(x.rating)}</span><span class="sub">${x.rating.toFixed(1)} · ${t('bk_bookings',{n:x.bookings})}</span></span>
    </button>
    ${open ? `<div class="kv">
        <b>${t('bk_hoods')}</b><span>${x.hoods.join(', ')}</span>
        <b>${t('pets')}</b><span>${x.species.map(sp=>t(sp)).join(', ')}</span>
        <b>${t('bk_profile')}</b><span>${t('bk_years',{n:x.years})} · ${t('bk_bookings',{n:x.bookings})}</span>
      </div><p class="sub">${esc(x.intro)}</p>

  </div>`;
}
function bookingOwner(){
  const f = bkForm(), list = (S.bookings||[]).slice().sort((a,b)=> (firstDay(a)||'').localeCompare(firstDay(b)||''));

  const when = f.type==='single'
    ? `<div class="dayrow"><input type="date" data-f="bk.date" value="${f.date}"><span style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input type="time" data-f="bk.start" value="${f.start}"><input type="time" data-f="bk.end" value="${f.end}"></span><span></span></div>`
    : f.type==='range'
    ? `<p class="lbl">${t('bk_start_day')}</p><div class="dayrow"><input type="date" data-f="bk.date" value="${f.date}"><input type="time" data-f="bk.start" value="${f.start}"><span></span></div>
       <p class="lbl">${t('bk_end_day')}</p><div class="dayrow"><input type="date" data-f="bk.date2" value="${f.date2}"><input type="time" data-f="bk.end" value="${f.end}"><span></span></div>`
    : `${f.rows.map((r,i)=>`<div class="dayrow" data-row="${i}"><input type="date" data-f="bk.rdate" value="${r.date}">
        <span style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input type="time" data-f="bk.rstart" value="${r.start}"><input type="time" data-f="bk.rend" value="${r.end}"></span>
        <button class="xbtn" data-act="bk-del-day" aria-label="${t('remove')}">×</button></div>`).join('')}
       <button class="btn ghost sm" data-act="bk-add-day">${t('bk_add_day')}</button>`;
  const match = matchingSitters();
  const picker = `<section class="sec"><h2>${t('bk_sitters')}</h2>
    <div class="cards">
      <button class="choice ${f.sitter_ids.length?'':'sel'}" data-act="bk-any"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>
        <span><b>${t('bk_any')}</b><span>${t('bk_any_s')}</span></span></button>
      ${match.length ? `<p class="sub muted" style="margin:2px 2px 0">${t('bk_match')}</p>` + match.map(x=>sitterCard(x, f.sitter_ids.includes(x.id), true)).join('') : `<p class="sub muted">${t('bk_no_match')}</p>`}
    </div></section>`;
  const cards = list.map(b=>`<div class="bcard" data-booking="${b.id}">
      <h3>${bookingRange(b)} <span class="pill ${bkPill(b.state)}">${t('st_'+b.state)}</span></h3>
      <div class="kv"><b>${t('bk_invited')}</b><span>${esc(invitedText(b))}</span>
        ${b.accepted_by?`<b>${t('bk_sitter')}</b><span>${esc(bookingName(b))}</span>`:''}
        <b>${t('pets')}</b><span>${S.plan.pets.map(p=>esc(p.name)).join(', ')}</span></div>
      ${bkDays(b)}
      ${b.state==='declined'?`<p class="sub" style="color:var(--late)">${t('bk_declined_msg')}</p>`:''}
      ${b.state==='active' && b.checkin_at?`<p class="sub">${t('bk_checked_in',{time:hmOf(b.checkin_at)})}</p>`:''}
      <div class="brow">
        ${b.state==='declined'?`<button class="btn" data-act="bk-edit-search">${t('bk_edit_search')}</button>`:''}
        ${['requested','declined','accepted'].includes(b.state)?`<button class="btn ghost danger" data-act="bk-delete">${b.state==='requested'?t('bk_cancel'):t('bk_delete')}</button>`:''}
      </div></div>`).join('');
  const form = (showForm || !list.length) ? `<section class="sec"><h2>${t('bk_when')}</h2><div class="panel">${chips}${when}</div></section>
      ${picker}
      <section class="sec"><div class="panel"><button class="btn" data-act="bk-send">${t('bk_send')}</button></div></section>`
    : `<section class="sec"><button class="btn ghost" data-act="bk-form">${t('bk_new')}</button></section>`;
  return `${list.length?`<section class="sec"><h2>${t('bk_my')}</h2><div class="cards">${cards}</div></section>`:''}
    ${form}<section class="sec"><h2>${t('bk_plan')}</h2>${viewIntake()}</section>`;
}

    + P.meds.map(m=>`<div class="dayrow"><span>${m.time}</span><span class="muted">${t('med',{pet:esc((P.pets.find(p=>p.id===m.pet_id)||{}).name||'')})}: ${esc(m.text)}</span><span></span></div>`).join('')
    + P.custom.filter(c=>c.text).map(c=>`<div class="dayrow"><span>${c.time}</span><span class="muted">${esc(c.text)}</span><span></span></div>`).join('');

function bookingSitter(){
  const reqs = openRequests(), mine = myBookings().sort((a,b)=>(firstDay(a)||'').localeCompare(firstDay(b)||''));
  if(openBooking){
    const b = (S.bookings||[]).find(x=>x.id===openBooking);

      <div class="brow">${b.state==='active' ? `<button class="btn ghost" data-act="bk-checkout">${t('bk_checkout')}</button>`

}

/* ---------------- actions ---------------- */
function findTask(id){ return today().tasks.find(x=>x.id===id); }
function setOutcome(x, v){
  const nowIso = nowDate().toISOString();
  if(v==='ate_later'){ x.outcome='ate_later'; x.later_at=nowIso; play(x.pet_ids,'eat',6000); }
  else {
    x.state='done'; x.outcome = v==='done' ? null : v; x.done_at = nowIso; x.later_at=null;
    if(v==='ate') play(x.pet_ids,'eat',6000);
    else if(v==='refused') play(x.pet_ids,'refuse',100);
    else if(v==='sniff') play(x.pet_ids,'sniff',12000);
    else if(v==='run') play(x.pet_ids,'run',9000);
    else if(v==='skipped') x.pet_ids.forEach(id=>delete transient[id]);
  }
  refresh();
}
function dismissCard(id){
  const d = today(); S.dismissed[d.date+'/'+id] = true; save();
  const el = document.querySelector(`[data-card="${CSS.escape(id)}"]`);
  if(el && !el.classList.contains('gone')){ el.classList.add('gone'); setTimeout(()=>{ renderScene(); renderMain(); }, 260); } else { renderScene(); renderMain(); }
  toast(t('dismissed'));
}

document.addEventListener('click', e=>{
  const tab = e.target.closest('[data-tab]');
  if(tab){ S.tab = tab.dataset.tab; openTask=null; save(); renderTabs(); renderMain(); window.scrollTo({top:0}); return; }
  if(e.target.closest('#roleBtn')){ S.role = S.role==='owner'?'sitter':'owner'; S.tab='today'; save(); render(); return; }
  const cloud = e.target.closest('[data-cloud]');
  if(cloud && S.role==='owner'){ if(S.tab!=='today'){ S.tab='today'; renderTabs(); renderMain(); } $('#cardsSec')?.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  const slot = e.target.closest('.slot');
  if(slot){ const id = slot.dataset.pet; if(!transient[id] || transient[id].until<Date.now()) play([id],'poke',1000); return; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act, v = a.dataset.v;
  if(act==='dismiss'){ dismissCard(a.closest('[data-card]').dataset.card); return; }
  if(act==='go-booking'){ S.tab='booking'; save(); renderTabs(); renderMain(); window.scrollTo({top:0}); return; }

  if(act==='chat-close'){ chatOpen = false; chatAll = false; renderMain(); return; }
  if(act==='ut'){ S.user_type = v; S.role = v; save(); render(); return; }
  if(act==='bk-type'){ bkForm().type = v; save(); renderMain(); return; }
  if(act==='bk-form'){ showForm = true; renderMain(); return; }
  if(act==='bk-any'){ bkForm().sitter_ids = []; save(); renderMain(); return; }
  if(act==='bk-sitter-open'){ const id = a.closest('[data-sitter]').dataset.sitter; openSitter = openSitter===id ? null : id; renderMain(); return; }
  if(act==='bk-pick'){ const id = a.closest('[data-sitter]').dataset.sitter, f = bkForm();
    f.sitter_ids = f.sitter_ids.includes(id) ? f.sitter_ids.filter(x=>x!==id) : [...f.sitter_ids, id]; save(); renderMain(); return; }
  if(act==='bk-open'){ openBooking = a.closest('[data-booking]').dataset.booking; renderMain(); window.scrollTo({top:0}); return; }
  if(act==='bk-back'){ openBooking = null; renderMain(); return; }
  if(act==='bk-delete'){ const id = a.closest('[data-booking]').dataset.booking;
    S.bookings = S.bookings.filter(x=>x.id!==id); save(); render(); return; }
  if(act==='bk-edit-search'){ const id = a.closest('[data-booking]').dataset.booking, b = S.bookings.find(x=>x.id===id);
    if(b){ const f = bkForm(); f.type = b.type || 'single'; f.sitter_ids = [...(b.sitter_ids||[])];
      const ds = (b.days||[]).map(x=>x.date).sort();
      if(ds.length){ f.date = ds[0]; f.date2 = ds[ds.length-1]; f.start = b.days[0].start; f.end = b.days[0].end;
        f.rows = b.days.map(d=>({date:d.date, start:d.start, end:d.end})); }
      S.bookings = S.bookings.filter(x=>x.id!==id); }
    showForm = true; save(); render(); return; }
  if(act==='bk-add-day'){ const f = bkForm(); f.rows.push({date:dateKey(nowDate()), start:'08:00', end:'18:00'}); save(); renderMain(); return; }
  if(act==='bk-del-day'){ const f = bkForm(); f.rows.splice(Number(a.closest('[data-row]').dataset.row),1); save(); renderMain(); return; }
  if(act==='bk-send'){ const f = bkForm(), days = buildDays(); if(!days.length) return;
    S.bookings.push({id:uid('bk_'), state:'requested', type:f.type, days, sitter_ids:[...f.sitter_ids], declined_by:[], accepted_by:null,
      owner:ownerName(), requested_at:nowDate().toISOString(), checkin_at:null});
    showForm = false; save(); render(); toast(t('bk_sent')); return; }
  if(act==='bk-accept'){ const id = a.closest('[data-booking]').dataset.booking, b = S.bookings.find(x=>x.id===id); if(!b) return;
    b.state='accepted'; b.accepted_by = ME_SITTER; b.sitter = sitterById(ME_SITTER).name; b.accepted_at = nowDate().toISOString();
    save(); render(); toast(t('bk_accepted_by',{name:b.sitter})); return; }
  if(act==='bk-decline'){ const id = a.closest('[data-booking]').dataset.booking, b = S.bookings.find(x=>x.id===id); if(!b) return;
    b.declined_by = [...(b.declined_by||[]), ME_SITTER];
    const left = b.sitter_ids.length ? b.sitter_ids.filter(x=>!b.declined_by.includes(x)) : goodSitters().filter(x=>!b.declined_by.includes(x.id));
    if(!left.length){ b.state='declined';
      S.chat.push({id:uid('m_'), from:'sitter', system:true, text:t('bk_declined_msg'), at:nowDate().toISOString()}); }
    save(); render(); toast(t('bk_declined')); return; }
  if(act==='bk-checkin'){ const el = a.closest('[data-booking]'); const b = el ? S.bookings.find(x=>x.id===el.dataset.booking) : cur(); if(!b) return;
    b.state='active'; b.checkin_at = nowDate().toISOString(); save(); render(); toast(t('bk_checked_in',{time:hmOf(b.checkin_at)})); return; }
  if(act==='bk-checkout'){ const el = a.closest('[data-booking]'); const b = el ? S.bookings.find(x=>x.id===el.dataset.booking) : cur(); if(!b) return;
    b.state='accepted'; b.checkin_at = null; save(); render(); return; }
  const tEl = a.closest('[data-task]');
  if(tEl){
    const x = findTask(tEl.dataset.task); if(!x) return;
    if(act==='toggle'){ openTask = openTask===x.id ? null : x.id; openCmt = null; renderMain(); return; }
    if(act==='tick'){ if(taskOff(x)) return;
      if(x.state==='done'){ x.state='todo'; x.outcome=null; x.done_at=null; x.later_at=null; x.pet_ids.forEach(id=>delete transient[id]); refresh(); }
      else setOutcome(x, x.kind==='feed' ? 'ate' : x.kind==='walk' ? 'sniff' : 'done');
      return; }
    if(act==='cmt'){ openCmt = x.id; renderMain(); return; }
    if(act==='cmt-close'){ openCmt = null; renderMain(); return; }
    if(act==='out'){ if(x.kind!=='feed' && x.kind!=='walk' && x.state==='done') return; setOutcome(x, v); return; }
    if(act==='undo'){ x.state='todo'; x.outcome=null; x.done_at=null; x.later_at=null; x.pet_ids.forEach(id=>delete transient[id]); refresh(); return; }
    return;
  }
  if(act==='set-role'){ S.role=v; save(); render(); return; }
  if(act==='set-lang'){ S.lang=v; save(); render(); return; }
  if(act==='set-theme'){ S.theme=v; save(); render(); return; }
  if(act==='set-season'){ S.season=v; save(); render(); return; }
  if(act==='set-demo'){ S.demo_time = v||null; save(); render(); return; }

  if(act==='demo-full'){ if(confirm(t('demo_full_q'))){ S = seed(); openBooking = null; showForm = false; chatOpen = false; save(); render(); window.scrollTo({top:0}); } return; }
  if(S.role!=='owner') return;
  const P = S.plan, petEl = a.closest('[data-pet]'), pet = petEl && P.pets.find(p=>p.id===petEl.dataset.pet);
  if(act==='add-pet'){ P.pets.push({id:uid('pet_'), name:S.lang==='en'?'New pet':'Nieuw', species:'dog', coat:LOOKS.dog.coats[0], pattern:'solid', ears:'flop'}); }
  else if(act==='del-pet' && pet){ P.pets = P.pets.filter(p=>p!==pet); P.walks.forEach(w=>w.dog_ids=w.dog_ids.filter(i=>i!==pet.id)); P.meds = P.meds.filter(m=>m.pet_id!==pet.id); }
  else if(act==='pet-species' && pet){ pet.species=v; pet.coat=LOOKS[v].coats[0]; pet.pattern=LOOKS[v].patterns[0]; if(v==='dog') pet.ears=pet.ears||'flop'; if(v!=='dog') P.walks.forEach(w=>w.dog_ids=w.dog_ids.filter(i=>i!==pet.id)); }
  else if(act==='pet-coat' && pet) pet.coat=v;
  else if(act==='pet-pattern' && pet) pet.pattern=v;
  else if(act==='pet-ears' && pet) pet.ears=v;
  else if(act==='add-feed') P.feedings.push({id:uid('fd_'), time:'12:00', portions:Object.fromEntries(P.pets.map(p=>[p.id,'h']))});
  else if(act==='del-feed'){ const id=a.closest('[data-feed]').dataset.feed; P.feedings=P.feedings.filter(f=>f.id!==id); }
  else if(act==='add-walk') P.walks.push({id:uid('wk_'), time:'15:00', duration:30, dog_ids:P.pets.filter(p=>p.species==='dog').map(p=>p.id)});
  else if(act==='del-walk'){ const id=a.closest('[data-walk]').dataset.walk; P.walks=P.walks.filter(w=>w.id!==id); }
  else if(act==='walk-dog'){ const w=P.walks.find(w=>w.id===a.closest('[data-walk]').dataset.walk); w.dog_ids = w.dog_ids.includes(v)? w.dog_ids.filter(i=>i!==v) : [...w.dog_ids, v]; }
  else if(act==='add-med') P.meds.push({id:uid('md_'), pet_id:P.pets[0].id, time:'08:00', text:''});
  else if(act==='del-med'){ const id=a.closest('[data-med]').dataset.med; P.meds=P.meds.filter(m=>m.id!==id); }
  else if(act==='add-custom') P.custom.push({id:uid('ct_'), time:'12:00', text:''});
  else if(act==='del-custom'){ const id=a.closest('[data-custom]').dataset.custom; P.custom=P.custom.filter(c=>c.id!==id); }
  else return;

});

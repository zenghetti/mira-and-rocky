document.addEventListener('pointerdown', e=>{
  const c = e.target.closest('.card'); if(!c || e.target.closest('.x')) return;
  sw = {el:c, x:e.clientX, y:e.clientY, dx:0, active:false};
});
document.addEventListener('pointermove', e=>{
  if(!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if(!sw.active){ if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)){ sw.active = true; sw.el.style.transition='none'; } else if(Math.abs(dy) > 10){ sw = null; return; } }
  if(sw.active){ sw.dx = dx; sw.el.style.transform = `translateX(${dx}px)`; sw.el.style.opacity = String(Math.max(.2, 1 - Math.abs(dx)/260)); }
});
function endSwipe(){
  if(!sw) return; const {el, dx, active} = sw; sw = null; if(!active) return;
  el.style.transition = '';
  if(Math.abs(dx) > 90){ el.style.transform = `translateX(${dx>0?'110%':'-110%'})`; el.style.opacity='0'; el.classList.add('gone'); setTimeout(()=>dismissCard(el.dataset.card), 200); }
  else { el.style.transform=''; el.style.opacity=''; }
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);

function planChanged(rerenderForm){
  rebuildToday(); save(); renderHeader(); renderScene();
  if(rerenderForm){ const y = window.scrollY; renderMain(); window.scrollTo({top:y}); }
}
let noteTimer = null;
document.addEventListener('input', e=>{
  const n = e.target.closest('[data-note]');
  if(n){ const x = findTask(n.dataset.note); if(x){ x.note = n.value; delete S.dismissed[dismissKey(today().date,x)]; clearTimeout(noteTimer); noteTimer = setTimeout(()=>{ save(); renderScene(); }, 400); } return; }
  const f = e.target.dataset.f; if(!f) return;
  if(f.startsWith('lg.')){ lg[f.slice(3)] = e.target.value; return; }
  const P = S.plan, later = fn => { clearTimeout(noteTimer); noteTimer = setTimeout(fn, 400); };
  if(!f.startsWith('sp.') && !f.startsWith('av.') && S.role!=='owner') return;
  if(f==='pet.name'){ P.pets.find(p=>p.id===e.target.closest('[data-pet]').dataset.pet).name = e.target.value; later(()=>planChanged(false)); }
  if(f==='pet.count'){ const p = P.pets.find(p=>p.id===e.target.closest('[data-pet]').dataset.pet);
    p.count = Math.max(1, Math.min(99, parseInt(e.target.value,10)||1)); later(()=>planChanged(false)); }
  if(f==='notes'){ P.notes = e.target.value; later(save); }
  if(f==='health'){ P.health = e.target.value; later(save); }
  if(f && f.startsWith('sp.')){
    const pr = S.sitters[me()] = S.sitters[me()] || profile(me()), fld = f.slice(3);
    if(['first','last','phone','email','about'].includes(fld)){ pr[fld] = e.target.value; later(()=>{ save(); renderScene(); }); }
    return;
  }
  if(f && f.startsWith('oi.')){ P.owner_info = P.owner_info||{}; P.owner_info[f.slice(3)] = e.target.value; later(save); }
  if(f==='vet.name'){ P.vet.name = e.target.value; later(save); }
  if(f==='vet.phone'){ P.vet.phone = e.target.value; later(save); }
  if(f==='med.text' || f==='custom.text'){
    const el = e.target.closest(f==='med.text'?'[data-med]':'[data-custom]');
    const list = f==='med.text' ? P.meds : P.custom; list.find(x=>x.id===(el.dataset.med||el.dataset.custom)).text = e.target.value; later(()=>planChanged(false));
  }
});
document.addEventListener('focusout', e=>{ if(e.target.matches('[data-note]')){ const x = findTask(e.target.dataset.note); if(x){ x.note = e.target.value; save(); } } });
document.addEventListener('change', e=>{
  const f = e.target.dataset.f; if(!f) return;
  if(f==='av.custom'){ const av = avOf(); av.custom = e.target.checked; if(!av.custom) calDay = null; save(); renderMain(); return; }
  if(f==='av.from' || f==='av.to'){ const av = avOf(), d = av.days[calDay];
    if(d){ const i = Number(e.target.closest('[data-time]').dataset.time); d.times[i][f==='av.from'?'from':'to'] = e.target.value; save(); renderMain(); }
    return; }
  if(!f.startsWith('sp.') && S.role!=='owner') return;
  const P = S.plan, val = e.target.value, byId = (list, attr) => list.find(x=>x.id===e.target.closest('['+attr+']').getAttribute(attr));
  if(f==='feed.time') byId(P.feedings,'data-feed').time = val;
  else if(f==='feed.portion') byId(P.feedings,'data-feed').portions[e.target.dataset.pet] = val;
  else if(f==='walk.time') byId(P.walks,'data-walk').time = val;
  else if(f==='walk.duration') byId(P.walks,'data-walk').duration = Number(val);
  else if(f==='chore.on') P.chores[e.target.dataset.k].on = e.target.checked;
  else if(f==='chore.time') P.chores[e.target.dataset.k].time = val;
  else if(f==='chore.time_off') P.chores.lamp.time_off = val;
  else if(f==='chore.weekday') P.chores.kliko.weekday = Number(val);
  else if(f==='med.time') byId(P.meds,'data-med').time = val;
  else if(f==='med.pet') byId(P.meds,'data-med').pet_id = val;
  else if(f==='sp.on'){ const pr = S.sitters[me()]; pr.prices[e.target.dataset.k].on = e.target.checked; save(); renderMain(); return; }
  else if(f==='sp.price'){ const pr = S.sitters[me()]; pr.prices[e.target.dataset.k][e.target.dataset.p] = Number(val)||0; save(); return; }
  else if(f==='sp.disc'){ const pr = S.sitters[me()], i = Number(e.target.closest('[data-disc]').dataset.disc);
    pr.prices[e.target.dataset.k].discounts[i][e.target.dataset.p] = Number(val)||0; save(); return; }
  else if(f==='oi.hood'){ P.owner_info = P.owner_info||{}; P.owner_info.hood = val; save(); renderMain(); return; }
  else if(f==='custom.time') byId(P.custom,'data-custom').time = val;
  else if(f.startsWith('bk.')){
    const fo = bkForm();
    if(f==='bk.date') fo.date = val; else if(f==='bk.date2') fo.date2 = val;
    else if(f==='bk.start') fo.start = val; else if(f==='bk.end') fo.end = val;
    else if(f==='bk.visits'){ fo.visits = Math.max(1, Number(val)||1); save(); renderMain(); return; }
    else if(f==='bk.walks'){ fo.walks = Math.max(1, Number(val)||1); save(); renderMain(); return; }
    else if(f==='bk.alone'){ fo.alone = Math.max(0, Number(val)||0); save(); return; }
    else { const r = fo.rows[Number(e.target.closest('[data-row]').dataset.row)];
      if(f==='bk.rdate') r.date = val; else if(f==='bk.rstart') r.start = val; else r.end = val; }
    save(); return;
  }
  else return;
  planChanged(false);
});

/* ---------------- export (Odoo-vormig) ---------------- */
function exportJSON(){
  const P = S.plan, f2 = m => Math.round(m/60*100)/100;
  const out = {
    _info:'Huisdierenoppas Curaçao export — veldnamen volgen docs/DATAMODEL.md',
    'res.partner': (S.contacts||[]).map(c=>({x_id:c.id, name:c.name, email:c.email, phone:c.phone||false, type:c.type, create_date:c.created})),
    'hoc.sitter': Object.entries(S.sitters||{}).map(([sid,p])=>({x_id:sid, name:((p.first||'')+' '+(p.last||'')).trim(), email:p.email||false,
      services:SERVICES.filter(k=>(p.prices||{})[k] && p.prices[k].on), hood_ids:p.hoods||[], care:p.care||[],
      availability_default:(p.avail||{}).base || 'yes', active:!p.deactivated_at, deactivated_at:p.deactivated_at||false})),
    'hoc.sitter.agreement': Object.entries(S.sitters||{}).filter(([,p])=>p.signed).map(([sid,p])=>({
      sitter_id:sid, version:p.signed.version, signed_at:p.signed.at, signer:p.signed.name||false,
      email:p.signed.mail||false, user_agent:p.signed.ua||false, copy_sent_at:p.signed.mailed_at||false})),
    'hoc.sitter.availability': Object.entries(S.sitters||{}).flatMap(([sid,p])=>Object.entries(((p.avail||{}).days)||{}).map(([date,d])=>({
      sitter_id:sid, date, mode:d.mode, service_ids:(d.services&&d.services.length)?d.services:'all',
      unavailable_times:(d.times||[]).map(x=>({time_from:f2(toMin(x.from)), time_to:f2(toMin(x.to))}))}))),
    'hoc.pet': P.pets.map(p=>({x_id:p.id, name:p.name||'', species:p.species, headcount:p.count||1, coat_color:p.coat||false, pattern:p.pattern||false, ears:p.ears||false})),
    'hoc.care.plan': [{x_id:'plan_1', notes:P.notes, health_declaration:P.health||false, vet_name:P.vet.name, vet_phone:P.vet.phone}],
    'hoc.care.plan.feeding': P.feedings.flatMap(f=>Object.entries(f.portions).filter(([,c])=>c!=='none').map(([pid,c])=>({plan_id:'plan_1', moment_id:f.id, time:f2(toMin(f.time)), pet_id:pid, portion:c}))),
    'hoc.care.plan.walk': P.walks.map(w=>({x_id:w.id, plan_id:'plan_1', time:f2(toMin(w.time)), duration:w.duration, pet_ids:w.dog_ids})),
    'hoc.care.plan.chore': Object.entries(P.chores).filter(([,c])=>c.on).map(([k,c])=>({plan_id:'plan_1', code:k, time:f2(toMin(c.time)), time_off:c.time_off?f2(toMin(c.time_off)):false, weekday:c.weekday??false}))
      .concat(P.meds.map(m=>({plan_id:'plan_1', code:'medication', time:f2(toMin(m.time)), pet_id:m.pet_id, description:m.text})))
      .concat(P.custom.map(c=>({plan_id:'plan_1', code:'custom', time:f2(toMin(c.time)), description:c.text}))),
    'hoc.booking': (S.bookings||[]).map(b=>({x_id:b.id, plan_id:'plan_1', type:b.type, state:b.state, services:b.services||['day'],
      visits_per_day:b.visits||1, walks_per_day:b.walks||1, alone_hours:b.alone??false, sitter_ids:b.sitter_ids||[],
      urgent:!!b.urgent, urgent_surcharge_pct:b.urgent?URGENT_BONUS:false, price_cap:b.cap ?? false,
      handover_from:(b.handover||{}).from || false, handover_at:(b.handover||{}).at || false, handover_reason:(b.handover||{}).reason || false,
      declined_by:b.declined_by||[], accepted_ids:acceptedBy(b), accepted_by:b.accepted_by||false, requested_at:b.requested_at||false, checkin_at:b.checkin_at||false})),
    'hoc.message': Object.entries(S.threads||{}).flatMap(([k,ms])=>{ const [bid,sid] = k.split('|');
      return ms.map(m=>({booking_id:bid, sitter_id:sid, author:m.from, body:m.text, create_date:m.at})); }),
    /* één spaarkaart per persoon; het saldo is de som van de regels hieronder */
    'hoc.loyalty.account': Object.entries(S.rewards||{}).map(([k,r])=>({x_id:'loy_'+k, partner_ref:rwPartner(k),
      role:k==='owner'?'owner':'sitter', valid_days:RW_DAYS, points_balance:rwBalance(r)})),
    /* platte regels: sparen is positief, inwisselen negatief — read_group op partner_ref geeft het saldo */
    'hoc.loyalty.line': Object.entries(S.rewards||{}).flatMap(([k,r])=>[
      ...(r.entries||[]).map(e=>({account_id:'loy_'+k, partner_ref:rwPartner(k), role:k==='owner'?'owner':'sitter',
        event:e.key.split(':')[0], ref:e.key.slice(e.key.indexOf(':')+1), points:e.n, create_date:e.at,
        expires_at:new Date(new Date(e.at).getTime()+RW_DAYS*864e5).toISOString(), expired:!rwFresh(e.at)})),
      ...(r.redeemed||[]).map(x=>({account_id:'loy_'+k, partner_ref:rwPartner(k), role:k==='owner'?'owner':'sitter',
        event:'redeem', ref:x.id, points:-x.cost, create_date:x.at, expires_at:false, expired:!rwFresh(x.at)}))]),
    /* wie heeft de animaties aan of uit staan */
    'hoc.user.settings': Object.entries(S.anim_by||{}).map(([mail,on])=>({partner_ref:mail, animations_enabled:on !== false})),
    'hoc.moderation.flag': (S.flags||[]).map(f=>({x_id:f.id, booking_id:f.booking||false, sitter_id:f.sitter||false, author:f.from, reason:'phone_number', body:f.text, create_date:f.at})),
    'hoc.booking.day': (S.bookings||[]).flatMap(b=>(b.days||[]).map(d=>({booking_id:b.id, date:d.date, time_start:f2(toMin(d.start)), time_end:f2(toMin(d.end))}))),
    'hoc.care.task': Object.values(S.days).flatMap(d=>d.tasks.map(x=>({x_id:d.date+'/'+x.id, date:d.date, kind:x.kind, name:taskTitle(x),
      time_start:f2(x.time_start), time_end:x.time_end!=null?f2(x.time_end):false, pet_ids:x.pet_ids, state:x.state,
      outcome:x.outcome||false, note:x.note||false, note_read:!!S.dismissed[d.date+'/'+x.id], done_at:x.done_at||false, later_at:x.later_at||false}))),
  };
  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'huisdierenoppas-export-'+dateKey(new Date())+'.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ---------------- boot ---------------- */
S = load() || seed();
if(!isActive()) S.tab = 'booking';
snapshot();
save(); render();
setInterval(yumTick, 5000);
let lastKey = dateKey(nowDate());
setInterval(()=>{
  const k = dateKey(nowDate());
  if(k!==lastKey){ lastKey=k; openTask=null; render(); return; }
  renderHeader(); renderScene();
  if(S.tab==='today' && !document.activeElement.matches('textarea') && !sw) renderMain();
}, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) render(); });
</script>
